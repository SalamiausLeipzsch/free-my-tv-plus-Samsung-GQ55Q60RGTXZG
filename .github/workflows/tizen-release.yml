# Free My TV+: baut und signiert die Samsung-App und legt sie als Release ab.
# Danach installiert der TizenBrew Installer sie mit "deinname/repo" auf den Fernseher.
# Start: GitHub -> Actions -> "Samsung-App bauen" -> "Run workflow".
name: Samsung-App bauen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: App bauen (ohne eigene Einstellungen, die Stadt kommt aus der Zeitzone des TVs)
        run: python3 tizen/build.py --generic

      - name: Tizen-Zertifikate laden (Entwickler-CA und oeffentliche Distributor-Signatur)
        run: |
          curl -fsSL https://download.tizen.org/sdk/tizenstudio/official/binary/certificate-generator_0.1.4_ubuntu-64.zip -o cg.zip
          unzip -q cg.zip 'data/tools/certificate-generator/certificates/*' -d cg

      # Das Autor-Zertifikat muss fuer Updates gleich bleiben: es liegt im Actions-Cache (nicht oeffentlich),
      # oder dauerhaft in den Secrets TIZEN_AUTHOR_P12 (Base64) und TIZEN_AUTHOR_PWD.
      - uses: actions/cache@v4
        with:
          path: tizen-author.p12
          key: tizen-author-v1

      - name: Autor-Zertifikat aus den Secrets (falls hinterlegt)
        env:
          P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
        run: |
          if [ -n "$P12" ]; then echo "$P12" | base64 -d > tizen-author.p12; fi

      - name: Signieren
        env:
          PWD_AUTHOR: ${{ secrets.TIZEN_AUTHOR_PWD }}
        run: |
          npm install --no-save --silent node-forge@1.3.1 jszip@3.10.1 github:reisxd/tizen.js
          node tools/sign_tizen.js cg/data/tools/certificate-generator/certificates tizen-author.p12 "${PWD_AUTHOR:-freemytvplus}" FreeMyTVPlus-tizen.wgt

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o '<widget[^>]*' tizen/config.xml | grep -o ' version="[^"]*"' | cut -d'"' -f2)
          # Text der Release: der Abschnitt dieser Version aus CHANGELOG.md, dazu die Installation
          awk -v v="## ${VERSION}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          printf '\n---\nInstallieren: TizenBrew Installer -> Install from GitHub -> `%s` (Host PC IP = IP vom PC, danach wieder 127.0.0.1). Signiert fuer Samsung-Fernseher 2017-2022 (Tizen 3 bis 6.5); ab 2023 signiert der Installer neu.\n\nInstall: TizenBrew Installer -> Install from GitHub -> `%s` (Host PC IP = IP of the PC, then back to 127.0.0.1). Signed for Samsung TVs 2017-2022 (Tizen 3 to 6.5); from 2023 the installer signs it again.\n' "${GITHUB_REPOSITORY}" "${GITHUB_REPOSITORY}" >> notes.md
          gh release create "v${VERSION}-${GITHUB_RUN_NUMBER}" FreeMyTVPlus-tizen.wgt \
            --title "Free My TV+ ${VERSION} (Build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
